<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="./favicon.svg" rel="icon" type="image/svg+xml"/>
    <title>SDF</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            font-family: sans-serif;
            color: #ddd;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        :where(nav a, .scene-control-button, .code-tabs-button) {
            transition:
                color 0.12s ease,
                background-color 0.12s ease,
                border-color 0.12s ease;
        }

        nav a:not(.active):hover,
        nav a:not(.active):focus-visible,
        .code-tabs-button:not(.active):hover,
        .code-tabs-button:not(.active):focus-visible {
            color: #111;
            background: #eee;
            border-color: #eee;
        }

        nav {
            display: flex;
            gap: 10px;
            padding: 16px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #scene-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .scene-link-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .scene-link-separator {
            flex: 0 0 100%;
            height: 1px;
            background-image: repeating-linear-gradient(to right, #555 0 2px, transparent 2px 7px);
        }

        .scene-link-group-title {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }

        .scene-link-list {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 6px 10px;
            border: 1px solid #444;
            border-radius: 999px;
        }

        nav a.active {
            color: #111;
            background: #ddd;
            border-color: #ddd;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 999px;
            line-height: 0;
        }

        .github-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        #scene-output {
            order: 2;
            box-sizing: border-box;
            width: min(642px, calc(100vw - 32px));
            margin: 0 0 32px;
            background: #0d0d0d;
            border: 1px solid #2d2d2d;
            overflow: hidden;
        }

        #scene-output:fullscreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            width: 100vw;
            max-width: none;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            background: #0d0d0d;
            border: 0;
        }

        #scene-output:fullscreen #scene-host {
            flex: 1 1 0;
            width: 100%;
            height: 0;
            min-height: 0;
            aspect-ratio: auto;
        }

        #scene-output:fullscreen #scene-host canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
        }

        #scene-output:fullscreen #scene-control-bar {
            flex: 0 0 auto;
        }

        #scene-output::backdrop {
            background: #0d0d0d;
        }

        #scene-host {
            position: relative;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            width: 100%;
            aspect-ratio: 8 / 5;
            background: #0d0d0d;
            overflow: hidden;
        }

        #scene-host canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #scene-control-bar {
            display: flex;
            align-items: center;
            min-height: 36px;
            color: #111;
            background: #e8e8e8;
            border-top: 1px solid #aaa;
        }

        .scene-control-spacer {
            flex: 1;
        }

        .scene-control-metric {
            box-sizing: border-box;
            min-width: 72px;
            padding: 0 10px;
            color: #111;
            font: 600 13px/36px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            text-align: center;
            white-space: nowrap;
        }

        #scene-fps {
            min-width: 82px;
        }

        #render-resolution {
            min-width: 100px;
        }

        .scene-control-select {
            box-sizing: border-box;
            width: 64px;
            height: 36px;
            padding: 0 6px;
            color: #111;
            background: transparent;
            border: 0;
            font: 600 12px/36px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            cursor: pointer;
        }

        .scene-control-select:hover,
        .scene-control-select:focus-visible {
            background: #ccc;
        }

        .scene-control-select:focus-visible {
            outline: 2px solid #555;
            outline-offset: -2px;
        }

        .scene-control-button {
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            color: #111;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        .scene-control-button:hover,
        .scene-control-button:focus-visible {
            color: #111;
            background: #ccc;
        }

        .scene-control-button:focus-visible {
            outline: 2px solid #555;
            outline-offset: -2px;
        }

        .scene-control-button[hidden] {
            display: none;
        }

        .scene-control-button svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #audio-toggle .audio-icon-on {
            display: none;
        }

        #audio-toggle.active .audio-icon-muted {
            display: none;
        }

        #audio-toggle.active .audio-icon-on {
            display: block;
        }

        #time-toggle .time-icon-play {
            display: none;
        }

        #time-toggle.paused .time-icon-pause {
            display: none;
        }

        #time-toggle.paused .time-icon-play {
            display: block;
        }

        #fullscreen-toggle .fullscreen-icon-exit {
            display: none;
        }

        #fullscreen-toggle.fullscreen-active .fullscreen-icon-enter {
            display: none;
        }

        #fullscreen-toggle.fullscreen-active .fullscreen-icon-exit {
            display: block;
        }

        .scene-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            font-size: 14px;
        }

        .scene-loading::before {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid #444;
            border-top-color: #ddd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #scene-host.ready .scene-loading {
            display: none;
        }

        canvas:focus,
        canvas:focus-visible {
            outline: none;
        }

        @keyframes spin {
            to {
                transform: rotate(1turn);
            }
        }

        #scene-docs {
            order: 3;
            box-sizing: border-box;
            width: min(760px, calc(100vw - 32px));
            margin: 0 16px 48px;
            padding: 24px;
            color: #ddd;
            background: #181818;
            border: 1px solid #333;
            border-radius: 16px;
            line-height: 1.55;
        }

        #scene-docs h1,
        #scene-docs h2,
        #scene-docs h3 {
            margin: 0 0 12px;
            color: #fff;
        }

        #scene-docs p {
            margin: 0 0 14px;
        }

        #scene-docs a,
        #scene-docs a:visited {
            color: #fff;
        }

        #scene-docs a:hover,
        #scene-docs a:focus-visible {
            color: #fff;
            text-decoration-thickness: 2px;
        }

        #scene-docs code {
            color: #fff;
            background: #242424;
            border-radius: 4px;
            padding: 2px 5px;
        }

        #scene-docs pre {
            overflow-x: auto;
            margin: 0 0 16px;
            padding: 14px;
            background: #0d0d0d;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
        }

        #scene-docs pre code {
            padding: 0;
            background: transparent;
        }

        .code-token-keyword {
            color: #ffb86c;
        }

        .code-token-type {
            color: #8be9fd;
        }

        .code-token-number {
            color: #bd93f9;
        }

        .code-token-string {
            color: #f1fa8c;
        }

        .code-token-comment {
            color: #777;
            font-style: italic;
        }

        .code-tabs {
            margin: 0 0 16px;
            background: #0d0d0d;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            overflow: hidden;
        }

        .code-tabs-buttons {
            display: flex;
            gap: 4px;
            padding: 4px 6px;
            background: #181818;
            border-bottom: 1px solid #2d2d2d;
        }

        .code-tabs-button {
            color: #bbb;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1.25;
        }

        .code-tabs-button.active {
            color: #111;
            background: #ddd;
            border-color: #ddd;
        }

        #scene-docs .code-tabs-panel pre {
            margin: 0;
            border: 0;
            border-radius: 0;
        }
    </style>
</head>
<body>
<nav>
    <div id="scene-links">
        <div class="scene-link-group">
            <div class="scene-link-group-title">Techniques</div>
            <div class="scene-link-list" data-scene-group="techniques"></div>
            <a
                class="github-link"
                href="https://github.com/es-repo/sdf"
                target="_blank"
                rel="noreferrer"
                aria-label="View source on GitHub"
                title="View source on GitHub"
            >
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
                </svg>
            </a>
            <div class="scene-link-separator" aria-hidden="true"></div>
        </div>
        <div class="scene-link-group">
            <div class="scene-link-group-title">Demos</div>
            <div class="scene-link-list" data-scene-group="demos"></div>
        </div>
    </div>
</nav>
<div id="scene-output">
    <section id="scene-host" aria-live="polite">
        <div class="scene-loading">Loading...</div>
    </section>
    <div id="scene-control-bar" role="toolbar" aria-label="Scene playback controls">
        <button class="scene-control-button" id="reset-scene-time" type="button" aria-label="Reset scene time" title="Reset scene time">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m19 20-10-8 10-8v16Z"/>
                <path d="M5 19V5"/>
            </svg>
        </button>
        <button class="scene-control-button" id="time-toggle" type="button" aria-label="Pause scene" aria-pressed="false" title="Pause scene">
            <svg class="time-icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14"/>
                <path d="M16 5v14"/>
            </svg>
            <svg class="time-icon-play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 5 11 7-11 7V5Z"/>
            </svg>
        </button>
        <output class="scene-control-metric" id="scene-time" aria-label="Scene time">0.00</output>
        <output class="scene-control-metric" id="scene-fps" aria-label="Frames per second">0.0 fps</output>
        <output class="scene-control-metric" id="render-resolution" aria-label="Render resolution">0 × 0</output>
        <div class="scene-control-spacer"></div>
        <select class="scene-control-select" id="render-scale" aria-label="Render scale" title="Render scale">
            <option value="0.1">10%</option>
            <option value="0.2">20%</option>
            <option value="0.3">30%</option>
            <option value="0.4">40%</option>
            <option value="0.5">50%</option>
            <option value="0.6">60%</option>
            <option value="0.7">70%</option>
            <option value="0.8">80%</option>
            <option value="0.9">90%</option>
            <option value="1" selected>100%</option>
        </select>
        <button class="scene-control-button" id="audio-toggle" type="button" aria-label="Unmute scene audio" aria-pressed="false" title="Unmute scene audio" hidden>
            <svg class="audio-icon-muted" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                <path d="m17 9 4 4"/>
                <path d="m21 9-4 4"/>
            </svg>
            <svg class="audio-icon-on" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
            </svg>
        </button>
        <button class="scene-control-button" id="fullscreen-toggle" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
            <svg class="fullscreen-icon-enter" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
                <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <svg class="fullscreen-icon-exit" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3v5H3"/>
                <path d="M16 3v5h5"/>
                <path d="M8 21v-5H3"/>
                <path d="M16 21v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<section id="scene-docs" hidden></section>
<script type="module">
    import init, * as wasmSceneViewer from "./pkg/sdf.js";

    attachCanvasToSceneHost();

    await init({module_or_path: new URL("./pkg/sdf_bg.wasm", import.meta.url)});

    if (wasmSceneViewer.initThreadPool && !crossOriginIsolated) {
        throw new Error("SharedArrayBuffer is unavailable. Serve dist/ with COOP/COEP headers.");
    }

    const sceneSlugs = csvSlugs(wasmSceneViewer.available_scene_slugs_csv());
    renderSceneLinks("demos", csvSlugs(wasmSceneViewer.demo_scene_slugs_csv()));
    renderSceneLinks("techniques", csvSlugs(wasmSceneViewer.technique_scene_slugs_csv()));
    const sceneLinks = [...document.querySelectorAll("[data-scene-link]")];
    const resetSceneTime = document.getElementById("reset-scene-time");
    const timeToggle = document.getElementById("time-toggle");
    const sceneTimeOutput = document.getElementById("scene-time");
    const sceneFpsOutput = document.getElementById("scene-fps");
    const renderResolutionOutput = document.getElementById("render-resolution");
    const renderScaleSelect = document.getElementById("render-scale");
    const audioToggle = document.getElementById("audio-toggle");
    const sceneOutput = document.getElementById("scene-output");
    const fullscreenToggle = document.getElementById("fullscreen-toggle");
    let currentScene = resolveScene(new URLSearchParams(window.location.search).get("scene"));
    let docsRenderVersion = 0;
    let hasUserInteracted = false;
    let sceneTimePaused = false;
    let audioEnabled = false;
    let audioUserMuted = false;
    let renderScale = Number(renderScaleSelect.value);

    updateSceneLinks(currentScene);
    updateTimeToggle();
    updateAudioToggle(currentScene);
    updateFullscreenToggle();

    const docsReady = renderSceneDocs(currentScene);

    if (wasmSceneViewer.initThreadPool) {
        await wasmSceneViewer.initThreadPool(wasmThreadPoolSize());
    }

    const sceneSize = getSceneRenderSize();
    updateRenderScaleInfo(sceneSize.width, sceneSize.height);
    wasmSceneViewer.start(currentScene, sceneSize.width, sceneSize.height);
    requestAnimationFrame(syncSceneTimePaused);
    requestAnimationFrame(updatePlaybackMetrics);
    maybeAutoEnableAudio();
    await docsReady;
    observeSceneHostSize();

    for (const link of sceneLinks) {
        link.addEventListener("click", async (event) => {
            const nextScene = link.dataset.sceneLink;

            if (!nextScene || nextScene === currentScene) {
                return;
            }

            event.preventDefault();
            await showScene(nextScene, {pushHistory: true});
        });
    }

    document.addEventListener("pointerdown", handleUserInteraction, {capture: true});
    document.addEventListener("keydown", handleUserInteraction, {capture: true});
    document.addEventListener("keydown", handleSpaceKey, {capture: true});

    resetSceneTime.addEventListener("click", () => {
        try {
            wasmSceneViewer.reset_scene_time();
        } catch (error) {
            console.error(error);
        }

        focusSceneCanvas();
    });

    timeToggle.addEventListener("click", () => {
        setSceneTimePaused(!sceneTimePaused);
        focusSceneCanvas();
    });

    audioToggle.addEventListener("click", () => {
        const nextAudioEnabled = !audioEnabled;
        const previousAudioUserMuted = audioUserMuted;

        audioUserMuted = !nextAudioEnabled;

        if (!setAudioEnabled(nextAudioEnabled)) {
            audioUserMuted = previousAudioUserMuted;
        }

        focusSceneCanvas();
    });

    renderScaleSelect.addEventListener("change", () => {
        renderScale = Number(renderScaleSelect.value);
        resizeSceneToHost();
        focusSceneCanvas();
    });

    fullscreenToggle.addEventListener("click", async () => {
        try {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else {
                await sceneOutput.requestFullscreen({navigationUI: "hide"});
            }
        } catch (error) {
            console.error(error);
        }

        focusSceneCanvas();
    });

    document.addEventListener("fullscreenchange", () => {
        updateFullscreenToggle();
        requestAnimationFrame(() => {
            requestAnimationFrame(resizeSceneToHost);
        });
    });

    window.addEventListener("popstate", async () => {
        await showScene(new URLSearchParams(window.location.search).get("scene"), {pushHistory: false});
    });

    async function showScene(sceneSlug, {pushHistory}) {
        const nextScene = resolveScene(sceneSlug);

        if (nextScene === currentScene) {
            return;
        }

        currentScene = nextScene;
        sceneTimePaused = false;
        updateSceneLinks(currentScene);
        updateTimeToggle();
        updateAudioToggle(currentScene);

        if (pushHistory) {
            history.pushState({scene: currentScene}, "", `?scene=${encodeURIComponent(currentScene)}`);
        }

        wasmSceneViewer.switch_scene(currentScene);
        focusSceneCanvas();
        maybeAutoEnableAudio();
        await renderSceneDocs(currentScene);
    }

    function resolveScene(sceneSlug) {
        return sceneSlugs.includes(sceneSlug) ? sceneSlug : sceneSlugs[0];
    }

    function csvSlugs(csv) {
        return csv.split(",").filter(Boolean);
    }

    function renderSceneLinks(group, slugs) {
        const list = document.querySelector(`[data-scene-group="${group}"]`);

        if (!list) {
            return;
        }

        list.replaceChildren(...slugs.map((slug) => {
            const link = document.createElement("a");
            link.href = `?scene=${encodeURIComponent(slug)}`;
            link.dataset.sceneLink = slug;
            link.textContent = slug;
            return link;
        }));
    }

    function updateSceneLinks(activeScene) {
        for (const link of sceneLinks) {
            link.classList.toggle("active", link.dataset.sceneLink === activeScene);
        }
    }

    function updateAudioToggle(activeScene) {
        const sceneHasAudio = wasmSceneViewer.scene_has_audio(activeScene);
        const label = audioEnabled ? "Mute scene audio" : "Unmute scene audio";

        audioToggle.hidden = !sceneHasAudio;
        audioToggle.title = label;
        audioToggle.setAttribute("aria-label", label);
        audioToggle.setAttribute("aria-pressed", String(audioEnabled));
        audioToggle.classList.toggle("active", audioEnabled);
    }

    function updateTimeToggle() {
        const label = sceneTimePaused ? "Continue scene" : "Pause scene";

        timeToggle.title = label;
        timeToggle.setAttribute("aria-label", label);
        timeToggle.setAttribute("aria-pressed", String(sceneTimePaused));
        timeToggle.classList.toggle("paused", sceneTimePaused);
    }

    function updateFullscreenToggle() {
        const isFullscreen = document.fullscreenElement === sceneOutput;
        const label = isFullscreen ? "Exit fullscreen" : "Enter fullscreen";

        fullscreenToggle.hidden = !document.fullscreenEnabled || typeof sceneOutput.requestFullscreen !== "function";
        fullscreenToggle.title = label;
        fullscreenToggle.setAttribute("aria-label", label);
        fullscreenToggle.setAttribute("aria-pressed", String(isFullscreen));
        fullscreenToggle.classList.toggle("fullscreen-active", isFullscreen);
    }

    function syncSceneTimePaused() {
        sceneTimePaused = wasmSceneViewer.scene_time_paused();
        updateTimeToggle();
    }

    function updatePlaybackMetrics() {
        const sceneTime = wasmSceneViewer.scene_time();
        const framesPerSecond = wasmSceneViewer.frames_per_second();

        sceneTimeOutput.value = sceneTime.toFixed(2);
        sceneFpsOutput.value = `${framesPerSecond.toFixed(1)} fps`;
        requestAnimationFrame(updatePlaybackMetrics);
    }

    function handleUserInteraction(event) {
        hasUserInteracted = true;

        if (audioToggle.contains(event.target)) {
            return;
        }

        if (event.target instanceof Element && event.target.closest("[data-scene-link]")) {
            return;
        }

        maybeAutoEnableAudio();
    }

    function handleSpaceKey(event) {
        if (event.code !== "Space") {
            return;
        }

        if (event.altKey || event.ctrlKey || event.metaKey) {
            return;
        }

        if (isEditableTarget(event.target)) {
            return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();
        setSceneTimePaused(!sceneTimePaused);
    }

    function isEditableTarget(target) {
        if (!(target instanceof Element)) {
            return false;
        }

        return Boolean(target.closest("button, input, select, textarea, [contenteditable='true']"));
    }

    function maybeAutoEnableAudio() {
        if (!hasUserInteracted || audioEnabled || audioUserMuted || !wasmSceneViewer.scene_has_audio(currentScene)) {
            return;
        }

        setAudioEnabled(true);
    }

    function setAudioEnabled(enabled) {
        const previousAudioEnabled = audioEnabled;

        audioEnabled = enabled;

        try {
            wasmSceneViewer.set_audio_enabled(audioEnabled);
        } catch (error) {
            audioEnabled = previousAudioEnabled;
            console.error(error);
            updateAudioToggle(currentScene);
            return false;
        }

        updateAudioToggle(currentScene);
        return true;
    }

    function setSceneTimePaused(paused) {
        const previousSceneTimePaused = sceneTimePaused;

        sceneTimePaused = paused;
        updateTimeToggle();

        try {
            wasmSceneViewer.set_scene_time_paused(sceneTimePaused);
        } catch (error) {
            sceneTimePaused = previousSceneTimePaused;
            updateTimeToggle();
            console.error(error);
        }
    }

    async function renderSceneDocs(sceneSlug) {
        const markdown = wasmSceneViewer.scene_markdown(sceneSlug);
        const docs = document.getElementById("scene-docs");
        const renderVersion = ++docsRenderVersion;

        if (!markdown.trim()) {
            docs.innerHTML = "";
            docs.hidden = true;
            return;
        }

        const {marked} = await import("https://cdn.jsdelivr.net/npm/marked/+esm");

        if (renderVersion !== docsRenderVersion) {
            return;
        }

        docs.innerHTML = renderMarkdown(markdown, marked);
        docs.hidden = false;
        activateCodeTabs(docs);
        highlightCodeBlocks(docs);
    }

    function attachCanvasToSceneHost() {
        const sceneHost = document.getElementById("scene-host");

        function attach(canvas) {
            canvas.tabIndex = 0;

            if (canvas.parentElement !== sceneHost) {
                sceneHost.appendChild(canvas);
            }

            sceneHost.classList.add("ready");
            focusSceneCanvas();
            return true;
        }

        const existingCanvas = document.querySelector("body > canvas");

        if (existingCanvas && attach(existingCanvas)) {
            return;
        }

        const observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                for (const node of mutation.addedNodes) {
                    if (node instanceof HTMLCanvasElement && attach(node)) {
                        observer.disconnect();
                        return;
                    }
                }
            }
        });

        observer.observe(document.body, {childList: true});
    }

    function focusSceneCanvas() {
        const canvas = document.querySelector("#scene-host canvas");

        if (!canvas) {
            return;
        }

        canvas.tabIndex = 0;
        canvas.focus({preventScroll: true});
    }

    function getSceneHostSize() {
        const sceneHost = document.getElementById("scene-host");

        return {
            width: Math.max(1, sceneHost.clientWidth),
            height: Math.max(1, sceneHost.clientHeight),
        };
    }

    function getSceneRenderSize() {
        const {width, height} = getSceneHostSize();

        return {
            width: Math.max(1, Math.round(width * renderScale)),
            height: Math.max(1, Math.round(height * renderScale)),
        };
    }

    function resizeSceneToHost() {
        const {width, height} = getSceneRenderSize();
        wasmSceneViewer.resize_scene(width, height);
        updateRenderScaleInfo(width, height);
    }

    function updateRenderScaleInfo(width, height) {
        const resolution = `${width} × ${height}`;
        renderResolutionOutput.value = resolution;
        renderScaleSelect.title = `Render scale: ${Math.round(renderScale * 100)}% (${resolution})`;
    }

    function wasmThreadPoolSize() {
        const cores = Math.max(1, navigator.hardwareConcurrency || 1);
        const configuredCores = Math.trunc(Number(wasmSceneViewer.wasm_app_cores?.() ?? 0));

        if (configuredCores > 0) {
            return Math.max(1, Math.min(cores, configuredCores));
        }

        if (configuredCores < 0) {
            return Math.max(1, cores + configuredCores);
        }

        return cores;
    }

    function observeSceneHostSize() {
        let lastWidth = 0;
        let lastHeight = 0;
        let frameId = 0;

        function syncSize() {
            frameId = 0;

            const {width, height} = getSceneHostSize();

            if (width === lastWidth && height === lastHeight) {
                return;
            }

            lastWidth = width;
            lastHeight = height;
            resizeSceneToHost();
        }

        function scheduleSync() {
            if (frameId !== 0) {
                return;
            }

            frameId = requestAnimationFrame(syncSize);
        }

        scheduleSync();

        if (typeof ResizeObserver === "function") {
            const observer = new ResizeObserver(() => {
                scheduleSync();
            });

            observer.observe(document.getElementById("scene-host"));
        }

        window.addEventListener("resize", scheduleSync);

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", scheduleSync);
        }
    }

    function renderMarkdown(markdown, marked) {
        const codeTabs = [];
        const markdownWithPlaceholders = markdown.replace(
            /:::code-tabs[^\n]*\n([\s\S]*?)\n:::/g,
            (_match, content) => {
                const placeholder = `@@SDF_CODE_TABS_${codeTabs.length}@@`;
                codeTabs.push(renderCodeTabs(content));
                return `\n\n${placeholder}\n\n`;
            },
        );

        let html = marked.parse(markdownWithPlaceholders);

        for (const [index, codeTabsHtml] of codeTabs.entries()) {
            const placeholder = `@@SDF_CODE_TABS_${index}@@`;
            html = html.replace(
                new RegExp(`<p>\\s*${escapeRegExp(placeholder)}\\s*</p>`, "g"),
                codeTabsHtml,
            );
            html = html.replaceAll(placeholder, codeTabsHtml);
        }

        return html;
    }

    function renderCodeTabs(content) {
        const codeBlocks = [...content.matchAll(/```(\w+)\n([\s\S]*?)```/g)];

        if (codeBlocks.length === 0) {
            return content;
        }

        const tabs = codeBlocks.map((block, index) => {
            const language = block[1];
            const code = block[2].replace(/\n$/, "");
            const label = {
                glsl: "GLSL",
                wgsl: "WGSL",
            }[language] ?? language[0].toUpperCase() + language.slice(1);

            return {
                language,
                label,
                code,
                active: index === 0,
            };
        });

        const buttons = tabs.map((tab, index) => `
            <button
                class="code-tabs-button${tab.active ? " active" : ""}"
                type="button"
                data-code-tab="${index}"
            >${escapeHtml(tab.label)}</button>
        `).join("");

        const panels = tabs.map((tab, index) => `
            <div class="code-tabs-panel" data-code-panel="${index}"${tab.active ? "" : " hidden"}>
                <pre><code class="language-${escapeHtml(tab.language)}">${escapeHtml(tab.code)}</code></pre>
            </div>
        `).join("");

        return `<div class="code-tabs"><div class="code-tabs-buttons">${buttons}</div>${panels}</div>`;
    }

    function activateCodeTabs(root) {
        for (const codeTabs of root.querySelectorAll(".code-tabs")) {
            const buttons = [...codeTabs.querySelectorAll("[data-code-tab]")];
            const panels = [...codeTabs.querySelectorAll("[data-code-panel]")];

            for (const button of buttons) {
                button.addEventListener("click", () => {
                    const activeIndex = button.dataset.codeTab;

                    for (const candidate of buttons) {
                        candidate.classList.toggle("active", candidate.dataset.codeTab === activeIndex);
                    }

                    for (const panel of panels) {
                        panel.hidden = panel.dataset.codePanel !== activeIndex;
                    }
                });
            }
        }
    }

    function highlightCodeBlocks(root) {
        for (const code of root.querySelectorAll("pre code")) {
            const language = [...code.classList]
                .find((className) => className.startsWith("language-"))
                ?.replace("language-", "");

            if (!language) {
                continue;
            }

            code.innerHTML = highlightCode(code.textContent, language);
        }
    }

    function highlightCode(code, language) {
        const keywords = {
            rust: new Set(["as", "const", "else", "fn", "for", "if", "impl", "in", "let", "loop", "match", "mod", "mut", "pub", "return", "struct", "true", "false", "use", "while"]),
            wgsl: new Set(["const", "else", "fn", "for", "if", "let", "return", "true", "false", "var"]),
            glsl: new Set(["const", "else", "for", "if", "return", "true", "false"]),
        }[language] ?? new Set();
        const types = {
            rust: new Set(["f32", "i32", "u32", "usize", "Vec2", "Vec3"]),
            wgsl: new Set(["f32", "i32", "u32", "vec2f", "vec3f", "vec2i", "vec3i", "vec2u", "vec3u"]),
            glsl: new Set(["float", "int", "vec2", "vec3", "vec4", "ivec2", "ivec3", "ivec4"]),
        }[language] ?? new Set();
        const tokenPattern = /\/\/.*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?(?:[fu]?\b)?|\b[A-Za-z_][A-Za-z0-9_]*\b/g;
        let highlighted = "";
        let lastIndex = 0;

        for (const match of code.matchAll(tokenPattern)) {
            const token = match[0];
            highlighted += escapeHtml(code.slice(lastIndex, match.index));
            highlighted += highlightToken(token, keywords, types);
            lastIndex = match.index + token.length;
        }

        highlighted += escapeHtml(code.slice(lastIndex));

        return highlighted;
    }

    function highlightToken(token, keywords, types) {
        if (token.startsWith("//") || token.startsWith("/*")) {
            return `<span class="code-token-comment">${escapeHtml(token)}</span>`;
        }

        if (token.startsWith("\"") || token.startsWith("'")) {
            return `<span class="code-token-string">${escapeHtml(token)}</span>`;
        }

        if (/^\d/.test(token)) {
            return `<span class="code-token-number">${escapeHtml(token)}</span>`;
        }

        if (keywords.has(token)) {
            return `<span class="code-token-keyword">${escapeHtml(token)}</span>`;
        }

        if (types.has(token)) {
            return `<span class="code-token-type">${escapeHtml(token)}</span>`;
        }

        return escapeHtml(token);
    }

    function escapeHtml(value) {
        return value
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
</script>
</body>
</html>
